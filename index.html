<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1813" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Cardápio digital da Cactus Burguer. Escolha, personalize seu pedido e envie para a loja pelo WhatsApp." />

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- LCP: preload responsivo da arte principal, priorizando AVIF. -->

      rel="preload"
      as="image"
      type="image/avif"
      href="/images/cactus-hero-v061-960.avif"

      imagesizes="(max-width: 820px) 100vw, 71vw"
